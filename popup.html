<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>试玩广告引擎识别</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>试玩识别 v0.3.10</h1>
      <span class="version">界面优化</span>
    </header>

    <div id="sample-comparison-box" class="hidden">
      <!-- Will be populated by JS -->
    </div>

    <div id="tab-info" class="tab-meta">
      <div id="tab-title" class="truncate">获取中...</div>
      <div id="tab-id" class="small-text">TAB: --</div>
    </div>

    <div id="status-container">
      <div id="status" class="status-idle">准备就绪</div>
      <div id="scan-meta" class="hidden">
        <div id="last-url" class="truncate"></div>
        <div id="scan-time"></div>
      </div>
    </div>

    <div id="mismatch-notice" class="warning-box hidden">
      <strong>页面不匹配</strong>
      <p>当前页面与上次扫描页面不一致，请重新扫描。</p>
      <button id="re-scan-btn" class="mini-btn">重新扫描</button>
    </div>

    <section id="batch-panel" class="batch-panel hidden">
      <div class="batch-title-row">
        <strong>飞书批量扫描</strong>
        <span id="batch-count" class="small-text">未导入</span>
      </div>
      <textarea id="batch-input" placeholder="从飞书复制多行后粘贴到这里，插件会自动识别“试玩链接”列。也支持一行一个 URL。"></textarea>
      <div class="batch-actions">
        <button id="batch-start-btn" class="primary-btn">开始批量</button>
        <button id="batch-copy-engine-btn" class="secondary-btn" disabled>复制引擎列</button>
        <button id="batch-copy-map-btn" class="secondary-btn" disabled>复制对照表</button>
        <button id="batch-copy-rows-btn" class="secondary-btn" disabled>复制整行</button>
        <button id="batch-clear-btn" class="secondary-btn">清空</button>
      </div>
      <div id="batch-status" class="small-text">等待粘贴飞书行。</div>
      <div id="batch-results" class="batch-results"></div>
    </section>

    <main id="results-list">
      <div class="empty-state">
        <p>点击下方按钮开始扫描当前页面。</p>
      </div>
    </main>

    <footer>
      <div id="action-btns">
        <div class="primary-action-row">
          <button id="scan-btn" class="primary-btn">开始识别</button>
          <button id="batch-toggle-btn" class="secondary-btn">批量</button>
        </div>
        <div class="utility-action-row">
          <button id="copy-btn" class="secondary-btn compact-btn" title="复制飞书审核格式" disabled>复制结果</button>
          <button id="debug-copy-btn" class="secondary-btn compact-btn" title="复制完整调试信息" disabled>复制调试</button>
          <button id="reset-btn" class="secondary-btn compact-btn" title="清空所有记录">清空</button>
        </div>
      </div>
      <div id="scanning-btns" class="hidden">
        <button id="stop-btn" class="danger-btn">停止扫描/重置</button>
      </div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
